name: gidosa-frontend-webapp dev

on:
  push:
    branches: [dev]
  pull_request:
    branches:
      - dev
    #   types: [closed]
    paths-ignore:
      - '.github/workflows/deploy-prod-gidosa-frontend-webapp.yml'
      # - 'public/**'
  workflow_dispatch:
